<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Luces 930E">
  <title>Panel de Luces Komatsu 930E-4</title>
  <style>
    :root {
      --bg-dark: #121417;
      --card-bg: #1c1f24;
      --accent-red: #e74c3c;
      --accent-yellow: #f1c40f;
      --accent-blue: #3498db;
      --accent-green: #2ecc71;
      --text-main: #f5f6fa;
      --text-muted: #a4b0be;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: 500px;
      padding: 12px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.15rem; font-weight: 700; margin: 0; color: #fff; letter-spacing: 0.5px; }
    header span { font-size: 0.8rem; background: #272b34; padding: 4px 8px; border-radius: 6px; color: #f1c40f; font-weight: 600; }
    
    .panel-container {
      width: 100%;
      max-width: 500px;
      background: #1b1e23;
      border: 3px solid #2d3436;
      border-radius: 16px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .grid-row {
      display: grid;
      gap: 6px;
      width: 100%;
    }
    .grid-row-6 { grid-template-columns: repeat(6, 1fr); }
    .grid-row-7 { grid-template-columns: repeat(7, 1fr); }

    .light-btn {
      aspect-ratio: 1/1;
      border-radius: 8px;
      background: #252830;
      border: 2px solid #3a3f4d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.15s ease;
      padding: 2px;
    }
    .light-btn:active, .light-btn.active {
      transform: scale(0.94);
      border-color: #ffffff;
      box-shadow: 0 0 12px rgba(255,255,255,0.4);
    }
    .light-btn.red { border-color: #962d2d; background: linear-gradient(135deg, #441717, #240e0e); }
    .light-btn.yellow { border-color: #8c7b24; background: linear-gradient(135deg, #3d3513, #211d0a); }
    .light-btn.disabled { opacity: 0.25; pointer-events: none; }
    
    .light-btn .icon {
      width: 82%;
      height: 82%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }
    .light-btn .label {
      font-size: 7px;
      text-align: center;
      line-height: 1;
      color: #ddd;
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 95%;
    }

    /* Modal / Bottom Sheet informativo */
    .sheet-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      display: none;
      align-items: flex-end;
      z-index: 999;
    }
    .sheet-overlay.open { display: flex; }
    .sheet-content {
      width: 100%;
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-handle {
      width: 40px; height: 5px;
      background: #4b4b4b;
      border-radius: 3px;
      margin: 0 auto 15px auto;
    }
    .sheet-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #2d3436;
      padding-bottom: 12px;
      margin-bottom: 15px;
    }
    .sheet-icon {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
    }
    .sheet-title h2 { margin: 0; font-size: 1.15rem; color: #fff; }
    .sheet-title p { margin: 3px 0 0 0; font-size: 0.8rem; color: var(--text-muted); }

    .info-card {
      background: #15181d;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border-left: 4px solid var(--accent-blue);
    }
    .info-card.sec-accion { border-left-color: #2ecc71; }
    .info-card.sec-consecuencia { border-left-color: #e74c3c; }
    .info-card.sec-nota { border-left-color: #f1c40f; }

    .info-card .tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .info-card .val {
      font-size: 0.9rem;
      line-height: 1.4;
      color: #ecf0f1;
    }
    .btn-close {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #2d3436;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>KOMATSU 930E-4</h1>
    <span>31 LUCES DE PANEL</span>
  </header>

  <div class="panel-container" id="panelGrid">
    <!-- Filas y botones renderizados dinámicamente -->
  </div>

  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
    <div class="sheet-content" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-icon" id="modalIcon"></div>
        <div class="sheet-title">
          <h2 id="modalTitle">Título</h2>
          <p id="modalCategory">Luz de Advertencia</p>
        </div>
      </div>
      <div class="info-card">
        <div class="tag">Significado</div>
        <div class="val" id="modalSignificado"></div>
      </div>
      <div class="info-card sec-consecuencia">
        <div class="tag">Consecuencias</div>
        <div class="val" id="modalConsecuencias"></div>
      </div>
      <div class="info-card sec-accion">
        <div class="tag">Acción Requerida</div>
        <div class="val" id="modalAccion"></div>
      </div>
      <div class="info-card sec-nota" id="modalNotaContainer" style="display:none;">
        <div class="tag">Nota / Excepciones</div>
        <div class="val" id="modalNota"></div>
      </div>
      <button class="btn-close" onclick="closeSheet()">Cerrar</button>
    </div>
  </div>

  <script>
    const lightsData = [
      // Fila 0 (6 luces)
      { id: "0_0", row: 0, col: 0, color: "red", icon: "🌡️💧", name: "T° Aceite Hidr.",
        significado: "Alta temperatura de aceite hidráulico.",
        consecuencias: "Prolongar la operación podría causar daños al equipo, debido a que esta temperatura está asociada a la temperatura del sistema de frenos de servicio.",
        accion: "Detener el camión en forma segura y detener el motor." },
      { id: "0_1", row: 0, col: 1, color: "red", icon: "🛢️⬇️", name: "Nivel Hidr.",
        significado: "Bajo nivel de aceite en el estanque hidráulico.",
        consecuencias: "Problemas con el suministro de aceite al grupo de bombas, daño por cavitación, etc.",
        accion: "Detener el camión en forma segura y apagar el motor." },
      { id: "0_2", row: 0, col: 2, color: "yellow", icon: "(P)", name: "Freno Est.",
        significado: "Indicador de freno de estacionamiento aplicado.",
        consecuencias: "Desgaste en los discos de frenos producto de aplicar estos con el camión en movimiento. Daño crítico al sistema.",
        accion: "Aplicación solo con el camión completamente detenido." },
      { id: "0_3", row: 0, col: 3, color: "yellow", icon: "🚫Ⓜ️", name: "Mot. Arranque",
        significado: "Indicador de falla en uno de los motores de arranque.",
        consecuencias: "Continuar operando por un período prolongado puede sobrecargar y dañar el motor que está funcionando.",
        accion: "Solicitar asistencia técnica." },
      { id: "0_4", row: 0, col: 4, color: "red", icon: "⚡🚫", name: "Sin Energía",
        significado: "Sin energía. Sin retardo. Sin propulsión.",
        consecuencias: "Perder el control, daños en el sistema eléctrico de propulsión y retardo (alternador, MT, parrillas, tableros eléctricos, etc.).",
        accion: "Detener el camión con frenos de servicio en forma segura, detener el motor y esperar asistencia técnica." },
      { id: "0_5", row: 0, col: 5, color: "red", icon: "⚙️🚫", name: "Corte Prop.",
        significado: "Sin propulsión.",
        consecuencias: "Puede perder el control del equipo, puede dañar el sistema de propulsión.",
        accion: "Detener el camión en forma segura y solicitar asistencia técnica." },

      // Fila 1 (6 luces)
      { id: "1_0", row: 1, col: 0, color: "red", icon: "🔘↔️", name: "Pres. Direcc.",
        significado: "Baja presión en el sistema de dirección.",
        consecuencias: "Problemas en el sistema hidráulico de dirección; de continuar la operación del camión, podría quedar sin dirección.",
        accion: "Detener el camión en forma segura y detener el motor.",
        nota: "Es normal que la luz encienda en algunas condiciones de operación a bajas RPM." },
      { id: "1_1", row: 1, col: 1, color: "yellow", icon: "⚬-⚬", name: "Lubricación",
        significado: "Baja presión del sistema de lubricación automática.",
        consecuencias: "La presión en el sistema de lubricación está por debajo de 2000 psi.",
        accion: "Solicitar asistencia técnica." },
      { id: "1_2", row: 1, col: 2, color: "yellow", icon: "(⭕)", name: "Freno Serv.",
        significado: "Indicador de freno de servicio o traba aplicado.",
        consecuencias: "Desgaste en los discos de frenos o incorrecta aplicación de los frenos de servicio. Daño crítico al sistema.",
        accion: "Aplicar los frenos de servicio de acuerdo a requerimiento.",
        nota: "¡El correcto uso del freno de servicio depende del correcto uso del retardador!" },
      { id: "1_3", row: 1, col: 3, color: "yellow", icon: "💡🔙", name: "Luz Reversa",
        significado: "Luces de reversa, de accionamiento manual.",
        consecuencias: "Operar con deficiencia en el sistema de luces puede generar un problema mayor o una señal incorrecta sobre su uso.",
        accion: "Activar de acuerdo a requerimiento o pruebas." },
      { id: "1_4", row: 1, col: 4, color: "yellow", icon: "⚙️❗", name: "Adv. Prop.",
        significado: "Advertencia en el sistema de propulsión.",
        consecuencias: "Probable falla en el sistema de propulsión.",
        accion: "Detener el camión y solicitar asistencia técnica." },
      { id: "1_5", row: 1, col: 5, color: "yellow", icon: "⚙️🌙", name: "Prop. Descanso",
        significado: "Sistema de propulsión en descanso.",
        consecuencias: "Al estar la luz encendida el equipo no tiene propulsión; al estar apagada el gabinete eléctrico se encuentra energizado.",
        accion: "No aplicar propulsión (luz encendida). En esta condición se puede intervenir el equipo técnicamente; el sistema se encuentra sin alto voltaje." },

      // Fila 2 (6 luces)
      { id: "2_0", row: 2, col: 0, color: "red", icon: "⏳↔️", name: "Acum. Direcc.",
        significado: "Baja presión de precarga en los acumuladores de dirección.",
        consecuencias: "Problemas con la precarga de nitrógeno de los acumuladores de dirección, riesgo de quedar sin dirección.",
        accion: "Detener el camión en forma segura, no realice maniobras con el switch de arranque (ON / OFF)." },
      { id: "2_1", row: 2, col: 1, color: "yellow", icon: "⚡⨂", name: "Disyuntor",
        significado: "Disyuntor activado.",
        consecuencias: "Indica una falla en el circuito de 24 volt; esta puede ser cortocircuito en el sistema.",
        accion: "Solicitar asistencia técnica." },
      { id: "2_2", row: 2, col: 2, color: "yellow", icon: "⬆️🚛", name: "Tolva Arriba",
        significado: "Indicador del camión con tolva arriba.",
        consecuencias: "Mover el camión con tolva arriba puede dañar gravemente la estructura, pasadores, cilindros de levante y chasis.",
        accion: "Mover el camión cuando sea estrictamente necesario, este no debe sobrepasar los 8 kph." },
      { id: "2_3", row: 2, col: 3, color: "yellow", icon: "⏱️🚫", name: "Parada Prog.",
        significado: "Indicador de detención programada de motor.",
        consecuencias: "Si el sistema está inoperativo, al detener el motor puede acortar la vida útil de los componentes.",
        accion: "Una vez estacionado, al detener el motor se encenderá automáticamente la luz indicadora dependiendo de 3 condiciones: 1. T° refrigerante, 2. RPM, 3. % de combustible." },
      { id: "2_4", row: 2, col: 4, color: "yellow", icon: "🌡️⚙️", name: "T° Propulsión",
        significado: "Alta temperatura en el sistema de propulsión.",
        consecuencias: "Daño en el sistema de propulsión por alta temperatura.",
        accion: "Solicitar asistencia técnica, o cambiar la condición de operación." },
      { id: "2_5", row: 2, col: 5, color: "yellow", icon: "⚙️⏳", name: "Prop. No Prep.",
        significado: "Sistema de propulsión no preparado.",
        consecuencias: "Al estar la luz encendida el equipo no tiene propulsión; no aplicar propulsión, puede producir daños en el sistema.",
        accion: "Aplicar propulsión solo hasta que la luz se encuentre apagada." },

      // Fila 3 (7 posiciones: 1 deshabilitada + 6 activas)
      { id: "3_0", row: 3, col: 0, color: "disabled", icon: "⊘", name: "Sin Uso",
        significado: "Espacio no asignado / deshabilitado en esta configuración.",
        consecuencias: "Ninguna.", accion: "Ninguna acción requerida." },
      { id: "3_1", row: 3, col: 1, color: "yellow", icon: "💧⚙️", name: "Filtro Hidr.",
        significado: "Filtro de aceite hidráulico saturado, o aceite hidráulico muy frío.",
        consecuencias: "Daños en componentes del sistema hidráulico. El filtro está derivando el aceite hidráulico por la válvula by-pass, lo que significa que el aceite no está siendo filtrado.",
        accion: "Realizar maniobras para estabilizar la temperatura de trabajo del aceite o solicitar asistencia técnica." },
      { id: "3_2", row: 3, col: 2, color: "yellow", icon: "⚡⚙️", name: "Retardo Din.",
        significado: "Indicador de la aplicación del retardador dinámico.",
        consecuencias: "Pérdida de control del equipo al aplicar fuera de la curva de retardo.",
        accion: "Aplicación efectiva siempre dentro de la curva de retardo.",
        nota: "¡Retardo efectivo sobre 4.8 kph o 3 millas por hora!" },
      { id: "3_3", row: 3, col: 3, color: "yellow", icon: "📉📐", name: "RSC Activo",
        significado: "Indicador de RSC (Retard Speed Control) activado.",
        consecuencias: "Operar fuera de la curva de retardo aumenta el riesgo de perder el control de velocidad del camión.",
        accion: "Se debe operar con el RSC activado." },
      { id: "3_4", row: 3, col: 4, color: "red", icon: "❗", name: "Falla IM",
        significado: "Falla en el módulo interfase (IM).",
        consecuencias: "Seguir operando el camión en esta condición puede afectar la comunicación entre controladores y perder el control del camión.",
        accion: "Detener el camión en forma segura y solicitar asistencia técnica." },
      { id: "3_5", row: 3, col: 5, color: "yellow", icon: "🐢⚙️", name: "Prop. Reducida",
        significado: "Propulsión reducida.",
        consecuencias: "Se ha producido una falla en el sistema de propulsión; el equipo se encuentra operando solo con un motor de tracción (MT).",
        accion: "Velocidad reducida, solo para traslado a taller." },
      { id: "3_6", row: 3, col: 6, color: "yellow", icon: "(✔)", name: "Test Frenos",
        significado: "Test del sistema de frenos.",
        consecuencias: "Posibilidad de falla en el sistema de frenos que no sea advertida, y pérdida de control del equipo.",
        accion: "Aplicar procedimiento, detener el equipo en un lugar seguro." },

      // Fila 4 (7 luces)
      { id: "4_0", row: 4, col: 0, color: "red", icon: "(◂●▸)", name: "Pres. Frenos",
        significado: "Baja presión en el sistema hidráulico de frenos.",
        consecuencias: "Problemas con la presión de trabajo del sistema hidráulico de frenos de servicio; de continuar la operación puede quedar sin frenos de servicio.",
        accion: "Detener el camión en forma segura y detener el motor." },
      { id: "4_1", row: 4, col: 1, color: "yellow", icon: "⛽⬇️", name: "Nivel Comb.",
        significado: "Bajo nivel de combustible.",
        consecuencias: "Fallas en el sistema de inyección y pérdida de potencia del motor.",
        accion: "Rellenar el depósito de combustible." },
      { id: "4_2", row: 4, col: 2, color: "red", icon: "🛢️🚫", name: "Parada Falla",
        significado: "Detención del motor diésel por falla.",
        consecuencias: "Prolongar la operación puede ocasionar fallas graves en el motor; si se detiene el motor se pierde el retardo y el sistema hidráulico.",
        accion: "Detener el movimiento del camión; si es necesario detener el motor con el interruptor de parada de emergencia." },
      { id: "4_3", row: 4, col: 3, color: "yellow", icon: "🛢️✔", name: "Rev. Motor",
        significado: "Revisar motor diésel.",
        consecuencias: "Prolongar la operación podría ocasionar una falla grave en el motor diésel.",
        accion: "Solicitar asistencia técnica." },
      { id: "4_4", row: 4, col: 4, color: "red", icon: "🔋+-", name: "Carga 24V",
        significado: "Falla en el sistema de carga 24 volt.",
        consecuencias: "Puede perder el control de la propulsión o del equipo.",
        accion: "Detener el camión en forma segura y solicitar asistencia técnica." },
      { id: "4_5", row: 4, col: 5, color: "yellow", icon: "♨️⚙️", name: "Retardo Cont.",
        significado: "Retardo a nivel continuo.",
        consecuencias: "Operar un tiempo prolongado puede ocasionar daños en el sistema de propulsión o retardo (MT, resistencias, inversores, etc.).",
        accion: "Bajar la velocidad, modificar pendientes de trabajo, o bajar el esfuerzo de retardo." },
      { id: "4_6", row: 4, col: 6, color: "yellow", icon: "📖🔧", name: "Mantenimiento",
        significado: "Advertencia de servicio o mantenimiento.",
        consecuencias: "Daños en los sistemas del equipo.",
        accion: "Solicitar asistencia técnica." }
    ];

    function buildGrid() {
      const container = document.getElementById("panelGrid");
      const rows = [0, 1, 2, 3, 4];
      
      rows.forEach(r => {
        const rowDiv = document.createElement("div");
        rowDiv.className = `grid-row ${r < 3 ? 'grid-row-6' : 'grid-row-7'}`;
        
        const rowItems = lightsData.filter(d => d.row === r);
        rowItems.forEach(item => {
          const btn = document.createElement("div");
          btn.className = `light-btn ${item.color}`;
          btn.innerHTML = `<div class="icon">${item.icon}</div><div class="label">${item.name}</div>`;
          btn.onclick = () => showInfo(item);
          rowDiv.appendChild(btn);
        });
        container.appendChild(rowDiv);
      });
    }

    function showInfo(item) {
      if (item.color === 'disabled') return;
      if (window.navigator.vibrate) window.navigator.vibrate(20);

      document.getElementById("modalTitle").innerText = item.name;
      document.getElementById("modalSignificado").innerText = item.significado;
      document.getElementById("modalConsecuencias").innerText = item.consecuencias;
      document.getElementById("modalAccion").innerText = item.accion;
      
      const iconBox = document.getElementById("modalIcon");
      iconBox.innerText = item.icon;
      iconBox.style.background = item.color === 'red' ? '#962d2d' : '#8c7b24';

      const notaBox = document.getElementById("modalNotaContainer");
      if (item.nota) {
        document.getElementById("modalNota").innerText = item.nota;
        notaBox.style.display = "block";
      } else {
        notaBox.style.display = "none";
      }

      document.getElementById("sheetOverlay").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("sheetOverlay").classList.remove("open");
    }

    window.onload = buildGrid;
  </script>
</body>
</html>
